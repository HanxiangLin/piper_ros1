sensors:
  - sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
    # The gate is disabled by default. Raw RealSense data never updates the
    # planning scene unless the operator explicitly starts a pre-scan.
    point_cloud_topic: /piper/static_scan/points
    max_range: 2.0
    point_subsample: 1
    padding_offset: 0.03
    padding_scale: 1.0
    filtered_cloud_topic: /piper/static_scan/filtered_points
